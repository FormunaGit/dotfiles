services:
  n8n:
    build: .
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,zlib,crypto
      - NODE_PATH=/usr/local/lib/node_modules
      - N8N_RUNNER_TYPE=direct
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_CUSTOM_EXTENSIONS=/custom-nodes
      - DEBUG=mineflayer-viaproxy:*
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
      - /home/formuna:/home/node/home
      - /home/formuna/Data/Projects/n8n-nodes-mineflayer-elyby:/custom-nodes/n8n-nodes-mineflayer-elyby
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  redis:
    image: redis/redis-stack-server:latest
    restart: always
    volumes:
      - redis_data:/data

volumes:
  n8n_data:
  redis_data:
